// Milestone 3 module upgrades. Adds late-game capability modules to
// existing parts via MM patches. No new meshes or textures required.
//
// Force field: added to TE Large Drone Core.
//   The large drone core is the advanced autonomous command unit.
//   ecDrainPerSecond = 50 -- requires serious power generation to sustain.
//   Toggle via right-click in flight.

@PART[TE-Large_Drone_Core]:FOR[KoKo]
{
    MODULE
    {
        name              = ModuleForceField
        ecDrainPerSecond  = 50
    }
}
