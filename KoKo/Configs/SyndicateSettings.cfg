// Syndicate system tuning. All values config-driven -- no recompile needed.
//
// Detection formula:
//   baseDetection  = (partCount * partCountWeight)
//                  + (totalMass * massWeight)
//                  + (hottestPartTemp / tempDivisor)
//   stealthScore   = sum(ModuleStealth.stealthValue) * stealthMultiplier
//   netDetection   = max(0, baseDetection - stealthScore)
//   sabotageChance = Clamp01(netDetection / maxDetectionScore)
//
// Example outcomes with defaults:
//   tiny probe 1 part 0.1t 300K + 1 stealth module  ->  0% chance
//   medium lander 10 parts 5t 300K + 2 stealth      ->  ~2% chance
//   heavy burning vessel 30 parts 15t 1500K no stealth -> ~68% chance

SYNDICATE_SETTINGS
{
    partCountWeight   = 0.1     // detection contribution per part
    massWeight        = 0.2     // detection contribution per tonne
    tempDivisor       = 2000    // hottest-part kelvin / this = temp contribution
    stealthMultiplier = 1.0     // each unit of ModuleStealth.stealthValue subtracts this
    maxDetectionScore = 10.0    // net score at which sabotage chance = 100%

    // Facility attack rate. Real wall-clock seconds (unaffected by time warp).
    // Expected attacks per hour = (3600 / interval) * chance
    // Default: 600s * 0.15 = one attack every ~67 min of active playtime.
    facilityDestroyIntervalSeconds = 600
    facilityDestroyChance          = 0.15

    // Campaign / fortress settings.
    //
    // fortressDurationSeconds: game-time seconds until the Eeloo fortress completes.
    //   Advances with time warp -- every warp burns the deadline.
    //   Default: 55,221,270 = 6 Kerbin years.
    //     Rationale: player needs time to build income, scout locations, and make
    //     the Eeloo voyage. 2 Kerbin years (playtested 2026-05-31) was too short --
    //     didn't even allow enough time to travel to Eeloo, let alone prep for it.
    //   For testing, set to something small like 3600 (1 real hour of in-game time).
    //
    // midTwistThreshold: fraction of total syndicate locations that must be destroyed
    //   before the mid-game twist dialogue fires. Default 0.40 = 40%.
    // Extended to 10 Kerbin years. 6yr playtested fine for inner-system work,
    // but Eeloo transfer windows alone can eat 6yr. Player needs headroom.
    fortressDurationSeconds = 92035450
    // fortressDurationSeconds = 55221270   // 6 Kerbin years (previous value)
    // fortressDurationSeconds = 18407090   // 2 Kerbin years (too short)
    // fortressDurationSeconds = 3600       // test value
    midTwistThreshold       = 0.40

    // respawnDurationSeconds: game-time seconds before a destroyed location
    //   respawns. Only starts if the syndicate still has other active locations
    //   when this one is destroyed. If it was the last one, no timer starts.
    //   Default: 9,203,545 = 1 Kerbin year.
    //   For testing, set to something small like 600 (10 min in-game time).
    respawnDurationSeconds  = 9203545
}
