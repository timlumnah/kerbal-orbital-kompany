// Makes generalConstruction cost 0 and require no parent node.
// Autostrut is hardcoded to check this node. Player still clicks it
// once in R&D but it's instant and free.
// When CareerBootstrap is working this becomes redundant but harmless.

// Move probe/automation/flight nodes to cost=0 + anyParent so they are
// researchable immediately without grinding the prerequisite chain.
// Targets: Unmanned Tech, Advanced Unmanned Tech, Large Probes,
//          Automation, Advanced Flight Control.
// These gate MechJeb, advanced probe cores, and autopilot systems --
// all of which feel like baseline tooling in 2026 and should come early.
// Reference: https://wiki.kerbalspaceprogram.com/wiki/Technology_tree

@TechTree
{
    @RDNode:HAS[#id[generalConstruction]]
    {
        @cost = 0
        @anyParent = True
    }

    @RDNode:HAS[#id[unmannedTech]]
    {
        @cost = 0
        @anyParent = True
        // anyParent=True needs at least one parent unlocked. Adding start as
        // explicit parent guarantees this node is always researchable at cost=0.
        Parent
        {
            parentID = start
        }
    }

    @RDNode:HAS[#id[advUnmanned]]
    {
        @cost = 0
        @anyParent = True
    }

    @RDNode:HAS[#id[largeProbes]]
    {
        @cost = 0
        @anyParent = True
    }

    @RDNode:HAS[#id[automation]]
    {
        @cost = 0
        @anyParent = True
    }

    // flightControl was missing from patch entirely. Gates MechJeb SAS
    // and reaction wheel controls. Added with same approach as unmannedTech.
    @RDNode:HAS[#id[flightControl]]
    {
        @cost = 0
        @anyParent = True
        Parent
        {
            parentID = start
        }
    }

    @RDNode:HAS[#id[advFlightControl]]
    {
        @cost = 0
        @anyParent = True
        // Same fix as unmannedTech -- explicit start parent so anyParent fires.
        Parent
        {
            parentID = start
        }
    }
}
