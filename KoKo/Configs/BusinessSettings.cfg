// Tuning values for BusinessManager. Edit without recompiling.

BUSINESS_SETTINGS
{
    // --- business income ---
    fundsPerHour    = 5000  // funds per qualifying vessel per Kerbin hour (3600s)
    minCrew         = 2     // minimum crew present on vessel
    checkIntervalUT = 120   // game-seconds between scans
    minEC           = 10    // minimum ElectricCharge to count as powered

    // --- kerbal salary ---
    fundsPerKerbalPerHour = 100   // salary per active Kerbal per Kerbin hour
    maxXPOnHire           = true  // instantly set all hired Kerbals to level 5
    zeroCostOnHire        = true  // refund KSP's hiring fee immediately on hire

    // --- passive science ---
    sciencePerHour = 1.0          // science per qualifying business vessel per Kerbin hour
                                  // set to 0 to disable passive science entirely

    // --- business type income multipliers ---
    // Set via ModuleBusinessType on the Mobile Processing Lab in the editor.
    // Standard is the baseline (1.0x). Cycle type via right-click on the MPL.
    //
    //   Security   -- lower income, but halves Syndicate sabotage chance on same body
    //   Relay      -- higher income; rewards well-connected hubs
    //   Refueling  -- higher income; rewards ISRU-focused operations
    //
    securityMultiplier   = 0.8   // 80% income -- tradeoff for sabotage protection
    relayMultiplier      = 1.5   // 150% income
    refuelingMultiplier  = 1.3   // 130% income

    // Fraction of sabotage chance remaining when a Security business is on the same body.
    // 0.5 = 50% reduction (default). 0.0 = fully blocked (too strong).
    securitySabotageMultiplier = 0.5

    // Per-body income & science multiplier. Stacks on top of fundsPerHour/sciencePerHour
    // and applies equally to both funds and science output.
    // Formula: effective_rate = fundsPerHour * (1 + multiplier)
    //   Applies equally to funds and science.
    //
    //   +0.04  -->  4% bonus  (104% of base)
    //   +0.00  -->  no change (100% of base)
    //   -0.25  -->  25% reduction (75% of base)
    //   -0.75  -->  75% reduction (25% of base)  <-- NOT "pay 75%", pay only 25%
    //
    // orbital  -- applies to ORBITING vessels
    // landed   -- applies to LANDED/SPLASHED vessels (optional; falls back to orbital if omitted)
    //
    // Bodies not listed fall back to unknownBodyMultiplier.
    // Income floored at 0 -- multipliers below -1.0 are clamped.
    unknownBodyMultiplier = 0.0

    BODY_MULTIPLIER
    {
        body    = Kerbin
        orbital = -0.25     // 75% of base
        landed  = -0.40     // 60% of base
    }
    BODY_MULTIPLIER
    {
        body    = Mun
        orbital = 0.00
        landed  = 0.02
    }
