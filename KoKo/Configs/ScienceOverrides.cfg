// Set transmitValue = 1.0 on all experiments globally.
// Stock defaults range from 0.25-0.7 (goo/materials worst at 0.3),
// which hard-enforces return trips. Full transmit value removes that
// constraint without changing how science is gathered.

// % operator: create the field if absent, modify if present.
// @ would fail silently on definitions that don't already have transmitValue written out.
@EXPERIMENT_DEFINITION:AFTER[Squad]
{
    %transmitValue = 1.0
}
