// Replaced Syndicates.json with KSP ConfigNode format.

// Consolidated to one Syndicate. Added randomized locations.

// Major expansion: locations now on every landable planet and moon.
// Old hardcoded Kerbin/Mun Beta locations replaced by LOCATION_GROUP nodes.
// New LOCATION_GROUP concept: code generates 1-3 (planet) or 0-2 (moon)
// randomized locations per body at career start. Count is random per career.
// Backup: KoKo/Configs/deprecated/Syndicates_2026-06-03-1741.cfg

// RADIUS FIELD REFERENCE
//
//   dangerRadius    -- INNERMOST ring. Sabotage trigger zone.
//   revealRadius    -- MIDDLE ring. Sets revealed=true. Required for warhead targeting.
//   detectionRadius -- OUTERMOST ring. Sets discovered=true. Orange ring on map.
//   radius          -- LEGACY FALLBACK. Used if dangerRadius = 0.
//
// LOCATION_GROUP FIELDS
//
//   body            -- celestial body name (must match KSP body name exactly)
//   minCount        -- minimum number of locations to generate this career
//   maxCount        -- maximum number of locations to generate this career
//   namePrefix      -- generated names = namePrefix + " A", " B", " C"
//   latMin/latMax   -- latitude generation range
//   lonMin/lonMax   -- longitude generation range
//   (radius fields) -- applied to all generated locations in this group

SYNDICATES_DATABASE
{
    SYNDICATE
    {
        name = The Syndicate

        // ---- FIXED LOCATIONS (persistent across all careers) ----

        // Kerbin Outpost Alpha: Island Runway. Good first target -- close to KSC.
        LOCATION
        {
            name             = Kerbin Outpost Alpha
            body             = Kerbin
            lat              = -1.515
            lon              = -71.967
            // lat              = -0.022778        // KSC for testing
            // lon              = -74.529444       // KSC for testing
            radius           = 10000
            dangerRadius     = 4000
            detectionRadius  = 40000
            revealRadius     = 15000
            explodeChance    = 0.60
            cooldownSeconds  = 15
        }

        // Mun Outpost Alpha: Equatorial highlands. Forces lunar capability.
        LOCATION
        {
            name             = Mun Outpost Alpha
            body             = Mun
            lat              = 12.0
            lon              = 22.0
            radius           = 10000
