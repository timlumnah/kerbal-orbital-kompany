// Turns the MPL into a full all-in-one science package.
// All stock instrument experiments rolled into one part.
// Situation/biome constraints from ScienceDefs.cfg still apply normally
// (barometer won't show in space, seismic won't show in flight, etc.).
// Data transmitter intentionally excluded -- use comms dishes for that.
// EVA Report and Surface Sample excluded -- require kerbal outside.
// Crew Report already present on MPL stock.

@PART[Large_Crewed_Lab]:FOR[KoKo]
{
    // Business type selector. MPL is the required "nerve center" of every
    // qualifying business vessel, so it's the right place to set the type.
    // Right-click the lab in the editor or in flight to cycle the type.
    MODULE
    {
        name         = ModuleBusinessType
        businessType = Standard
    }

    // Mystery Goo
    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = mysteryGoo
        experimentActionName = Observe Mystery Goo
        resetActionName = Reset Goo Experiment
        reviewActionName = Review Goo Data
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = True
        rerunnable = True
        xmitDataScalar = 1.0
        dataIsCollectable = True
        collectActionName = Collect Goo Data
    }

    // Science Jr. — Materials Study
    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = mobileMaterialsLab
        experimentActionName = Run Materials Study
        resetActionName = Reset Materials Study
        reviewActionName = Review Materials Data
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = True
        rerunnable = True
        xmitDataScalar = 1.0
        dataIsCollectable = True
        collectActionName = Collect Materials Data
    }

    // Thermometer
    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = temperatureScan
        experimentActionName = Log Temperature Data
        resetActionName = Discard Temperature Data
        reviewActionName = Review Temperature Data
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = True
        rerunnable = True
        xmitDataScalar = 1.0
        dataIsCollectable = True
        collectActionName = Collect Temperature Data
    }

    // Barometer — atmosphere only (ScienceDefs handles the constraint)
    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = barometerScan
        experimentActionName = Log Pressure Data
        resetActionName = Discard Pressure Data
        reviewActionName = Review Pressure Data
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = True
        rerunnable = True
        xmitDataScalar = 1.0
        dataIsCollectable = True
        collectActionName = Collect Pressure Data
    }

    // Seismic Accelerometer — landed only
    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = seismicScan
        experimentActionName = Log Seismic Data
        resetActionName = Discard Seismic Data
        reviewActionName = Review Seismic Data
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = True
        rerunnable = True
        xmitDataScalar = 1.0
        dataIsCollectable = True
        collectActionName = Collect Seismic Data
    }

    // Gravioli Detector
    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = gravityScan
        experimentActionName = Detect Gravioli Particles
        resetActionName = Discard Gravity Data
        reviewActionName = Review Gravity Data
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = True
        rerunnable = True
        xmitDataScalar = 1.0
        dataIsCollectable = True
        collectActionName = Collect Gravity Data
    }

    // Atmospheric Fluid Spectro-Variometer — atmosphere only
    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = atmosphereAnalysis
        experimentActionName = Analyse Atmosphere
        resetActionName = Discard Atmosphere Data
        reviewActionName = Review Atmosphere Data
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = True
        rerunnable = True
        xmitDataScalar = 1.0
        dataIsCollectable = True
        collectActionName = Collect Atmosphere Data
    }
}
