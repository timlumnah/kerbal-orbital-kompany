// ModuleManager patch: adds ModuleProximityRefueler to all command parts.
// All parts start as receivers (isSource = false).
// Right-click the part in flight to enable/disable source mode.

// Add to all stock and modded command parts (pods, probe cores).
@PART[*]:HAS[@MODULE[ModuleCommand]]:FOR[KoKo]
{
    MODULE
    {
        name = ModuleProximityRefueler
        isSource = false
        transferRange = 100
        infiniteFuel = false
        resourceNames = LiquidFuel,Oxidizer,MonoPropellant,ElectricCharge,XenonGas,Ore
    }
}

// Custom drone cores from this mod — default to source mode (refueling stations).
// Player can toggle off via right-click if they want the drone to be a receiver instead.
@PART[large_drone_core]:FOR[KoKo]
{
    @MODULE[ModuleProximityRefueler]
    {
        isSource = true
        infiniteFuel = false
    }
}

@PART[small_drone_core]:FOR[KoKo]
{
    @MODULE[ModuleProximityRefueler]
    {
        isSource = true
        infiniteFuel = false
    }
}
