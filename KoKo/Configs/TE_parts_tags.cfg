// Universal tag + manufacturer patch for all custom TE parts.
// Covers both naming conventions: TE-* (hyphen) and TE_* (underscore).
//
// Effect: every TE part gets manufacturer = "KoKo" and the tag
// "koko" appended. In the VAB parts browser you can then:
//   - Filter by manufacturer "KoKo" to see only mod parts
//   - Search "koko" to get the same list
//   - Search "TE" to find any part by title prefix

@PART[TE-*]:FINAL
{
    %manufacturer = KoKo
    @tags ^= ,koko
}

@PART[TE_*]:FINAL
{
    %manufacturer = KoKo
    @tags ^= ,koko
}
