// Rewrote MM patch. Original was broken in two ways:
//
//   (1) @unlockTechs[*] targeted MODULE[MechJebCore] directly.
//       unlockTechs lives inside MechJebLocalSettings child nodes,
//       not at the MechJebCore level. MM never found anything to patch.
//
//   (2) Feature parts (features1-4) were not patched at all.
//       Modern MechJeb2 gates modules via hidden "feature" parts
//       (category=none) in specific tech nodes. Both systems must be
//       patched to actually unlock all modules.
//
// Fix: navigate MODULE[MechJebCore] -> MechJebLocalSettings -> each
// named module node and set @unlockTechs = start. Also move all four
// feature parts to TechRequired=start so they are auto-purchased on
// new career without touching any tech node.

// Patch MechJebLocalSettings tech gates for the main AR202 part.
// Targets any part carrying MechJebCore (AR202 and custom probe cores).
@PART[*]:HAS[@MODULE[MechJebCore]]:NEEDS[MechJeb2]:FINAL
{
    @TechRequired = start
    @entryCost = 0

    @MODULE[MechJebCore]
    {
        @MechJebLocalSettings
        {
            @MechJebModuleCustomWindowEditor { @unlockTechs = start }
            @MechJebModuleSmartASS { @unlockTechs = start }
            @MechJebModuleManeuverPlanner { @unlockTechs = start }
            @MechJebModuleNodeEditor { @unlockTechs = start }
            @MechJebModuleTranslatron { @unlockTechs = start }
            @MechJebModuleWarpHelper { @unlockTechs = start }
            @MechJebModuleAttitudeAdjustment { @unlockTechs = start }
            @MechJebModuleThrustWindow { @unlockTechs = start }
            @MechJebModuleRCSBalancerWindow { @unlockTechs = start }
            @MechJebModuleRoverWindow { @unlockTechs = start }
            @MechJebModuleAscentMenu { @unlockTechs = start }
            @MechJebModuleLandingGuidance { @unlockTechs = start }
            @MechJebModuleSpaceplaneGuidance { @unlockTechs = start }
            @MechJebModuleDockingGuidance { @unlockTechs = start }
            @MechJebModuleRendezvousAutopilotWindow { @unlockTechs = start }
            @MechJebModuleRendezvousGuidance { @unlockTechs = start }
        }
    }
}

// Feature parts: move all to start node.
// KSP auto-purchases all parts in a researched node, so start = always purchased.
@PART[mumech_MJ2_AR202_features1]:NEEDS[MechJeb2]:FINAL { @TechRequired = start  @entryCost = 0 }
@PART[mumech_MJ2_AR202_features2]:NEEDS[MechJeb2]:FINAL { @TechRequired = start  @entryCost = 0 }
@PART[mumech_MJ2_AR202_features3]:NEEDS[MechJeb2]:FINAL { @TechRequired = start  @entryCost = 0 }
@PART[mumech_MJ2_AR202_features4]:NEEDS[MechJeb2]:FINAL { @TechRequired = start  @entryCost = 0 }
