// TE Warhead (Small) -- weapon part for the syndicate strike system.
//
// Clone of stock noseCone. Same mesh. Key changes:
//   crashTolerance = 2  -- detonates on contact with anything
//   mass = 0.05         -- lightweight so rocket budget isn't eaten
//   ModuleWeapon        -- enables right-click target/arm workflow
//
// Player workflow:
//   1. Build strike rocket with this as the nose.
//   2. Launch, clear the pad, then right-click nose: Set Target -> Arm.
//   3. Fly/point toward target. Once active vessel switches and this
//      vessel goes on-rails (>2.5km), WeaponManager captures it and
//      simulates the strike after travel time elapses.
//
// estimatedSpeedMS = 500: ~Mach 1.5 at sea level. Tune in CFG if needed.

// TE Warhead (Small) -- standard on-rails strike weapon.
+PART[noseCone]:FOR[KoKo]
{
    @name           = TE_Warhead_Small
    @title          = TE Warhead (Small)
    @description    = Standard strike warhead. Arm and switch away -- WeaponManager handles delivery. Detonates on contact.
    @TechRequired   = start
    @entryCost      = 0
    @cost           = 500
    @mass           = 0.05
    @crashTolerance = 2
    @category       = Payload
    @subcategory    = 0
    @tags           = weapon warhead explosive syndicate strike nose cone te superparts

    MODULE
    {
        name             = ModuleWeapon
        estimatedSpeedMS = 500
    }
}

// TE Warhead (Heavy) -- higher-value targets. Flies faster, costs more.
// Useful against hardened locations like the Eeloo Fortress.
+PART[noseCone]:FOR[KoKo]
{
    @name           = TE_Warhead_Heavy
    @title          = TE Warhead (Heavy)
    @description    = Heavy-duty warhead. Higher simulated velocity -- reaches distant targets faster. More expensive and heavier than the standard warhead.
    @TechRequired   = start
    @entryCost      = 0
    @cost           = 2000
    @mass           = 0.20
    @crashTolerance = 3
    @category       = Payload
    @subcategory    = 0
    @tags           = weapon warhead explosive syndicate strike nose cone te superparts heavy

    MODULE
    {
        name             = ModuleWeapon
        estimatedSpeedMS = 800
    }
}

// TE Warhead (Micro) -- lightweight, low-profile. Carry more per warship.
// Shorter effective range -- suited for inner-system targets.
+PART[noseCone]:FOR[KoKo]
{
    @name           = TE_Warhead_Micro
    @title          = TE Warhead (Micro)
    @description    = Miniaturized warhead. Very lightweight -- pack several into a single warship. Lower simulated velocity than the standard warhead; best for short-range missions.
    @TechRequired   = start
    @entryCost      = 0
    @cost           = 200
    @mass           = 0.02
    @crashTolerance = 2
    @category       = Payload
    @subcategory    = 0
    @tags           = weapon warhead explosive syndicate strike nose cone te superparts micro

    MODULE
    {
        name             = ModuleWeapon
        estimatedSpeedMS = 200
    }
}

// TE Warhead (Kamikaze) -- early-game weapon. Pilot or drone flies it in manually.
// No WeaponManager required -- fires on physical impact with the target zone.
// Requires a revealed syndicate location within 15km at the moment of impact.
+PART[noseCone]:FOR[KoKo]
{
    @name           = TE_Warhead_Kamikaze
    @title          = TE Warhead (Kamikaze)
    @description    = Direct-impact warhead. No on-rails system required. Fly directly into a revealed Syndicate location and it fires on impact. Arm before launch. Works with crewed or autonomous craft.
    @TechRequired   = start
    @entryCost      = 0
    @cost           = 300
    @mass           = 0.05
    @crashTolerance = 1
    @category       = Payload
    @subcategory    = 0
    @tags           = weapon warhead explosive syndicate strike nose cone te superparts kamikaze

    MODULE
    {
        name         = ModuleKamikazeWeapon
        strikeRangeM = 15000
    }
}
