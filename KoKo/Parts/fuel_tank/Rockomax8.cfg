// Clone of Rockomax X200-8 (Rockomax8BW).
// Adds MonoPropellant and ElectricCharge like small_fuel_tank.cfg does.
// Original PART block replaced -- was a raw stock copy, would cause
// duplicate part conflicts in GameData.

+PART[Rockomax8BW]:NEEDS[Squad]
{
    @name = TE-Rockomax8
    @title = TE Rockomax X200-8
    @manufacturer = TimCo Training Division
    @description = A TimCo utility variant of the X200-8. Holds standard propellants plus monoprop and electric charge for convenience. Good for upper stages and landers that don't want extra parts.

    @TechRequired = start
    @entryCost = 0
    @cost = 800

    @tags ^= :$: start utility mono electric timco:

    // Keep stock LF/Ox amounts unchanged.

    RESOURCE
    {
        name = MonoPropellant
        amount = 100
        maxAmount = 100
    }

    RESOURCE
    {
        name = ElectricCharge
        amount = 200
        maxAmount = 200
    }
}
