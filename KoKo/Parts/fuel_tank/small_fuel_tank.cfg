// Clone the stock FL-T100 and make an "early" version unlocked at Start
// File: GameData/YourMod/Parts/FLT100_Early.cfg

+PART[fuelTankSmallFlat]:NEEDS[Squad]
{
    @name = TE-Small_Fuel_Tank
    @title = TE-Small_Fuel_Tank
    @manufacturer = TimCo Training Division
    @description = A starter-friendly clone of the classic T100 so you can build a liquid-fueled stage from day one. Same specs, earlier unlock.

    // Put it in the Start node so it's available at the beginning of Career mode
    @TechRequired = start

    // Optional: free to unlock like most Start-node parts (tweak if you want)
    @entryCost = 0

    // Keep the same purchase cost in the editor
    @cost = 150

    // Keep it categorized as a fuel tank
    @category = FuelTank

    // Append a couple of handy search tags without losing the originals
    @tags ^= :$:  start early beginner

    
    RESOURCE
    {
        name = MonoPropellant
        amount = 50
        maxAmount = 50
    }

    RESOURCE
    {
        name = ElectricCharge
        amount = 50
        maxAmount = 50
    }
}
