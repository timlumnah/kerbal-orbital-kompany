// Clone the stock OX-STAT-PD and make a beefier version
+PART[DeployedSolarPanel]:NEEDS[SquadExpansion/Serenity]
{
  @name = TE-deployed_science_solar_panel
  @title = TE-deployed_science_solar_panel
  @manufacturer = TimCo
  @description = A high-output variant for science outposts. Provides ample power so you don’t need a forest of panels. Requires a deployed control station like the original.

  // (Optional) tweak balance knobs
  @cost = 300
  @mass = 0.02

  // Keep it in Cargo like the original
  @category = Cargo
  @TechRequired = start
  @entryCost = 100

  // Make the power change inside the ground-experiment module
  @MODULE[ModuleGroundSciencePart]
  {
    // Stock is 1 — pick what you like: 5, 10, 20...
    @powerUnitsProduced = 30

    // Leave these alone unless you specifically want to change behavior
    @powerUnitsRequired = 0
    @isSolarPanel = true
    @TrackSun = true
  }

  // Optional: visually distinguish it in the PAW
  @MODULE[ModuleAnimationGroup]
  {
    // no change needed; retained for completeness
  }

  // Optional: unique tags so it’s easy to search in the cargo menu
  @tags ^= :$:  super boosted high-power :
}
