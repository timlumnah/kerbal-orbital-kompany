// Clone the stock part
+PART[probeStackLarge]  // <-- This is the internal 'name' field of the stock part
{
    @name = TE-Large_Drone_Core
    @title = TE Large Drone Core
    @manufacturer = TimCo Training Division
    @description = A drone core variant tuned for relaxed, high-ISP training flights.

    // Put it early in the tech tree or wherever you want
    @TechRequired = start
    @entryCost = 0
    @cost = 500
    @mass = 0.5

    @MODULE[ModuleReactionWheel*]
    {
        @PitchTorque = 100
        @YawTorque = 100
        @RollTorque = 200
    }
    @MODULE[ModuleDataTransmitter]
    {
        @antennaPower          = 5000
        @packetInterval        = 0.10    // seconds between packets
        @packetSize            = 4       // Mits per packet
        @packetResourceCost    = 12      // EC per packet
        @antennaCombinable     = True
        @antennaCombinableExponent = 0.75
    }

    MODULE
    {
        name = ModuleScienceContainer
        
        reviewActionName = #autoLOC_502201 //#autoLOC_502201 = Review Stored Data
        storeActionName = #autoLOC_502202 //#autoLOC_502202 = Store Experiments
        evaOnlyStorage = True // i.e. can nearby regular vessels also do this, or EVA only
        storageRange = 10
        canBeTransferredToInVessel = True
        canTransferInVessel = True
    }

    MODULE
    {
        // Large core is heavier/more parts so harder to fully suppress.
        // stealthValue=1.5 reduces detection on a typical small probe but
        // won't fully nullify a heavier build. Player stacks more stealth parts.
        name = ModuleStealth
        stealthValue = 1.5
    }


    // --- RESOURCES ---

    // If the cloned part already has ElectricCharge, update it
    @RESOURCE[ElectricCharge]
    {
        @amount = 4000
        @maxAmount = 4000
    }


    // Ensure MonoPropellant exists and is 50
    !RESOURCE[MonoPropellant] {}   // remove if it exists (from other patches)
    RESOURCE
    {
      name = MonoPropellant
      amount = 50
      maxAmount = 50
    }

    @tags ^= :$: trainer drone core start:
}
