// =======================================================
// GenericScience_Advanced.cfg
// Define separate experiments per part so you can tune each.
// Drop anywhere under GameData (requires ModuleManager).
// =======================================================


// ---------- 1) Define experiments (one per part type) ----------
EXPERIMENT_DEFINITION
{
  id = LabSurvey                 // For MPL-LG-2 Mobile Lab
  title = TimCo Field Survey
  baseValue = 24                 // Lab gives the best science per run
  scienceCap = 40
  dataScale = 1
  situationMask = 3              // 1 = SrfLanded
  biomeMask = 1                  // biome-specific when landed
  requireAtmosphere = False
  RESULTS { default = The lab team compiles an extensive in-situ analysis. }
}

EXPERIMENT_DEFINITION
{
  id = DrillSurveySmall          // For Drill-O-Matic Jr.
  title = Geological Micro-Survey
  baseValue = 17                  // smaller, lighter payout
  scienceCap = 30
  dataScale = 1
  situationMask = 3
  biomeMask = 1
  requireAtmosphere = False
  RESULTS { default = The compact rig scrapes a modest but useful dataset. }
}

EXPERIMENT_DEFINITION
{
  id = DrillSurveyLarge          // For Drill-O-Matic (large)
  title = Geological Core Survey
  baseValue = 21
  scienceCap = 40
  dataScale = 1
  situationMask = 3
  biomeMask = 1
  requireAtmosphere = False
  RESULTS { default = Deep core samples yield detailed stratigraphy. }
}

// --- Optional: scanning arms (Breaking Ground) ---
// Fill in real part names below once you look them up (see "How to find names" at bottom).
EXPERIMENT_DEFINITION
{
  id = ArmSurveySmall            // Small Scanning Arm
  title = Surface Feature Scan (Small)
  baseValue = 15
  scienceCap = 30
  dataScale = 1
  situationMask = 1
  biomeMask = 1
  requireAtmosphere = False
  RESULTS { default = The arm’s sensors map microfeatures of the surface. }
}

EXPERIMENT_DEFINITION
{
  id = ArmSurveyMedium            // Large Scanning Arm
  title = Surface Feature Scan (Medim)
  baseValue = 20
  scienceCap = 35
  dataScale = 1
  situationMask = 1
  biomeMask = 1
  requireAtmosphere = False
  RESULTS { default = High-fidelity mapping reveals complex mineral veining. }
}

EXPERIMENT_DEFINITION
{
  id = ArmSurveyLarge            // Large Scanning Arm
  title = Surface Feature Scan (Large)
  baseValue = 27
  scienceCap = 40
  dataScale = 1
  situationMask = 1
  biomeMask = 1
  requireAtmosphere = False
  RESULTS { default = High-fidelity mapping reveals complex mineral veining. }
}



// ---------- 2) Attach to specific parts ----------

// MPL-LG-2 Mobile Processing Lab
@PART[Large_Crewed_Lab]:FOR[GenericScienceAdvanced]
{
  MODULE
  {
    name = ModuleScienceExperiment
    experimentID = LabSurvey
    experimentActionName = Run Field Lab Survey
    resetActionName = Reset Survey
    useStaging = False
    useActionGroups = True
    xmitDataScalar = 0.9             // labs transmit fairly well
    dataIsCollectable = True
    collectActionName = Collect Data
    interactionRange = 1.7
    rerunnable = True
  }
  MODULE
  {
    name = ModuleScienceExperiment
    experimentID = crewReport
    experimentActionName = Take Crew Report
    resetActionName = Discard Crew Report
    useStaging = False
    useActionGroups = True
    xmitDataScalar = 0.9
    dataIsCollectable = True
    collectActionName = Collect Data
    interactionRange = 1.7
    rerunnable = True
  }

  // Lab already has storage, but this is harmless if duplicated
  MODULE
  {
    name = ModuleScienceContainer
    reviewActionName = Review Stored Data
    storeActionName = Store Experiments
    evaOnlyStorage = False
    storageRange = 2
    canBeTransferredToInVessel = True
    canTransferInVessel = True
  }

  @tags ^= :$:  survey field science :
}

// Drill-O-Matic Jr. (MiniDrill)
@PART[MiniDrill]:FOR[GenericScienceAdvanced]
{
  MODULE
  {
    name = ModuleScienceExperiment
    experimentID = DrillSurveySmall
    experimentActionName = Geological Micro‑Survey
    resetActionName = Reset Survey
    useStaging = False
    useActionGroups = True
    xmitDataScalar = 0.6             // worse transmission from drills
    dataIsCollectable = True
    collectActionName = Collect Data
    interactionRange = 1.5
    rerunnable = True
  }

  MODULE
  {
    name = ModuleScienceContainer
    reviewActionName = Review Stored Data
    storeActionName = Store Experiments
    evaOnlyStorage = False
    storageRange = 2
    canBeTransferredToInVessel = True
    canTransferInVessel = True
  }

  @tags ^= :$:  survey field science :
}

// Drill-O-Matic (RadialDrill)
@PART[RadialDrill]:FOR[GenericScienceAdvanced]
{
  MODULE
  {
    name = ModuleScienceExperiment
