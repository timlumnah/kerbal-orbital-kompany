// Clone the stock Vector engine
+PART[RCSblock_01_small]  // <-- This is the internal 'name' field of the stock part
{
    @name = TE-RCS_Small
    @title = TE RCS Small
    @manufacturer = TimCo Training Division
    @description = An RCS variant tuned for relaxed, high-ISP training flights.

    // Put it early in the tech tree or wherever you want
    @TechRequired = start
    @entryCost = 0
    @cost = 500
    @mass = 0.01

    // Change the thrust/ISP
    @MODULE[ModuleRCSFX*]
    {
        @thrusterPower = 100
        !atmosphereCurve {}        // delete the original curve
        atmosphereCurve            // add a fresh one
        {
          key = 0 99999999
          key = 1 99999999
          key = 12 99999999
        }
    }

    @tags ^= :$: trainer rcs start:
}
