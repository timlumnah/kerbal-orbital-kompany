// KoKo Syndicate Detector. Clone of stock CamSat (SENTINEL telescope).
// Locked behind scienceTech. When placed in orbit, the SyndicateZonesManager
// orbital scan detects ModuleSyndicateTelescope and fully reveals all syndicate
// locations on that body instead of the standard yellow approx-discover ring.
PART
{
    name   = TE_SyndicateDetector
    module = Part
    author = KoKo

    MODEL
    {
        model = Squad/Parts/Misc/AsteroidDay/CamSat
    }
    rescaleFactor = 1

    node_stack_bottom = 0,-.14,0,0,-1,0,0

    TechRequired = scienceTech
    entryCost    = 9000
    cost         = 4500
    category     = Science
    subcategory  = 0
    title        = KoKo Syndicate Detector
    manufacturer = KoKo
    description  = A directional infrared telescope modified for detecting Syndicate thermal signatures. Place in orbit of any body to fully reveal all Syndicate installations on that body. Does not scan moons from planetary orbit -- each moon requires its own satellite.

    attachRules = 1,0,0,1,0

    mass             = 0.1
    dragModelType    = default
    maximum_drag     = 0.2
    minimum_drag     = 0.2
    angularDrag      = 1
    crashTolerance   = 7
    maxTemp          = 2000
    bulkheadProfiles = size1
    tags             = superparts syndicate detector telescope scan intelligence

    MODULE
    {
        name = ModuleSyndicateTelescope
    }

    MODULE
    {
        name             = ModuleCargoPart
        stackableQuantity = 1
        packedVolume     = -1
    }
}
