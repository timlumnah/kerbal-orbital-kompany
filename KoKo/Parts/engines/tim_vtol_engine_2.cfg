// Clone the stock Vector engine
+PART[radialEngineMini_v2]  // <-- This is the internal 'name' field of the stock Vector
{
    // Was TE-VTOL_Trainer — collided with tim_vtol_engine_1.cfg same name.
    @name = TE-VTOL_Spider
    @title = TE “VTOL” Radial Spider
    @manufacturer = TimCo Training Division
    @description = A VTOL "Spider" radial-mount engine variant tuned for relaxed, high-ISP training flights.

    // Put it early in the tech tree or wherever you want
    @TechRequired = start
    @entryCost = 0
    @cost = 750
    @mass = 0.02

    // Change the thrust/ISP
    @MODULE[ModuleEngines*]
    {
        @maxThrust = 200
        !atmosphereCurve {}        // delete the original curve
        atmosphereCurve            // add a fresh one
        {
          key = 0 4000
          key = 1 4000
          key = 12 4000
        }
    }

    @tags ^= :$: Spider VTOL engine boosted infinite:
}
