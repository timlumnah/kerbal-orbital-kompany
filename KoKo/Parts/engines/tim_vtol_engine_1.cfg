// Clone the stock Vector engine
+PART[microEngine_v2]  // <-- This is the internal 'name' field of the stock Ant
{
    // Was TE-VTOL_Trainer — collided with tim_vtol_engine_2.cfg same name.
    @name = TE-VTOL_Ant
    @title = TE “VTOL” Ant
    @manufacturer = TimCo Training Division
    @description = A VTOL "Ant" engine variant tuned for relaxed, high-ISP training flights.

    // Put it early in the tech tree or wherever you want
    @TechRequired = start
    @entryCost = 0
    @cost = 750
    @mass = 0.02

    // Change the thrust/ISP
    @MODULE[ModuleEngines*]
    {
        @maxThrust = 100
        !atmosphereCurve {}        // delete the original curve
        atmosphereCurve            // add a fresh one
        {
          key = 0 4000
          key = 1 4000
          key = 12 4000
        }
    }

    @tags ^= :$: Ant VTOL engine infinite:
}
