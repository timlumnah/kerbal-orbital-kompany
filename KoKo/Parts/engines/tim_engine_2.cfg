// Clone stock RAPIER

// Removed MultiModeEngine and air-breathing ModuleEnginesFX.
// TE-RAPIER is now closed-cycle (rocket) only.
// Reason: multi-mode engines break MechJeb dV calculations.

+PART[RAPIER]
{
  @name = TE-RAPIER
  @title = TE RAPIER
  @manufacturer = TimCo
  @description = A RAPIER engine variant tuned for relaxed, high-ISP training flights. Closed-cycle rocket only.

  @TechRequired = start
  @entryCost = 0
  @cost = 1000
  @mass = 1.5

  // Strip multi-mode behavior
  !MODULE[MultiModeEngine] {}

  // Strip air-breathing mode
  !MODULE[ModuleEnginesFX]:HAS[#engineID[AirBreathing]] {}

  // Closed-cycle (rocket) mode -- numbers unchanged
  @MODULE[ModuleEnginesFX]:HAS[#engineID[ClosedCycle]]
  {
    @maxThrust = 4000
    !atmosphereCurve {}
    atmosphereCurve
    {
      key = 0   600        // Isp at vacuum
      key = 1   600        // Isp at sea level
    }
  }

  @tags ^= :$: trainer rapier:
}
