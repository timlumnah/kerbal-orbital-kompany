// Clone the stock Vector engine
+PART[SSME]  // <-- This is the internal 'name' field of the stock Vector
{
    @name = TE-Vector
    @title = TE “Vector”
    @manufacturer = TimCo
    @description = A Vector engine variant tuned for relaxed, high-ISP training flights.

    // Put it early in the tech tree or wherever you want
    @TechRequired = start
    @entryCost = 0
    @cost = 1000
    @mass = 1.5

    // Change the thrust/ISP
    @MODULE[ModuleEngines*]
    {
        @maxThrust = 6000
        !atmosphereCurve {}        // delete the original curve
        atmosphereCurve            // add a fresh one
        {
          key = 0 4000
          key = 1 4000
          key = 12 4000
        }
    }

    @tags ^= :$: trainer vector boosted infinite:
}
